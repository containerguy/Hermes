openapi: 3.1.0
info:
  title: Hermes API
  description: |
    HTTP API für die Hermes LAN-Party-Koordination.

    **Authentifizierung**
    - **Browser:** Session-Cookie `hermes_session` nach Login (wie die Web-UI).
    - **API-Client:** `Authorization: Bearer <token>` mit einem im Profil erzeugten API-Token.

    **CSRF:** Schreibende Anfragen aus dem Browser senden den Header `x-hermes-csrf` (siehe `GET /api/auth/csrf`).
    Bei reiner Bearer-Authentifizierung entfällt die CSRF-Pflicht.

    **API-Token-Scopes**
    - `full`: dieselben Rechte wie der zugehörige Benutzer (Admin/Manager/…); Schreibzugriff wie mit Session.
    - `read_only`: nur `GET`/`HEAD`/`OPTIONS`; schreibende Methoden liefern `403` mit `api_token_nur_lesen`.

    **Hinweis:** Ist der Header `Authorization: Bearer …` gesetzt, wird bei ungültigem Token **kein** Session-Cookie
    als Fallback verwendet (explizit nur Cookie *oder* gültiger Bearer).

    Öffentlich ohne Login: `GET /api/health`, `GET /api/settings/public`, `GET /api/openapi.yaml`, `GET /api/docs`, Kiosk-Pfad (falls aktiviert).
  version: 0.15.1

servers:
  - url: /
    description: Relativ zur Hermes-Instanz

tags:
  - name: auth
    description: Login, Profil, Sitzungen, API-Tokens
  - name: events
    description: Spielrunden (Events)
  - name: main-events
    description: Events (z. B. LAN-Party, Turniertag) mit Start und Ende; klammern Runden und deren Benachrichtigungen
  - name: admin
    description: Admin — Benutzer, Invites, Einstellungen, Backup (nur Rolle admin)
  - name: push
    description: Web-Push
  - name: realtime
    description: Server-Sent Events
  - name: meta
    description: Health & Dokumentation

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /api/health:
    get:
      tags: [meta]
      summary: Liveness
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /api/settings/public:
    get:
      tags: [meta]
      summary: Öffentliche Einstellungen
      security: []
      responses:
        "200":
          description: Theme, Projekt-Template, Release-Metadaten (Version, Repo-URL).
          content:
            application/json:
              schema:
                type: object
                required: [settings, release]
                properties:
                  settings:
                    type: object
                    description: Öffentliche Teilmenge der App-Einstellungen
                  release:
                    type: object
                    required: [version, repoUrl]
                    properties:
                      version:
                        type: string
                        example: "0.13.1"
                      repoUrl:
                        type: string
                        format: uri

  /api/openapi.yaml:
    get:
      tags: [meta]
      summary: OpenAPI-Spezifikation (YAML)
      security: []
      responses:
        "200":
          description: YAML
          content:
            application/yaml:
              schema:
                type: string

  /api/docs:
    get:
      tags: [meta]
      summary: Swagger UI (interaktive Doku)
      security: []
      responses:
        "200":
          description: HTML

  /api/auth/csrf:
    get:
      tags: [auth]
      summary: CSRF-Token für Browser-Clients
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  header:
                    type: string
                    example: x-hermes-csrf
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/api-tokens:
    get:
      tags: [auth]
      summary: Eigene API-Tokens auflisten
      description: Nur Klartext beim Anlegen einmal sichtbar; hier ohne Secret.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiTokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiTokenPublic"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [auth]
      summary: Neues API-Token erzeugen
      description: |
        Antwort enthält `token` **nur in dieser Antwort**. Danach nur noch Hash gespeichert.
        Read-only-Tokens dürfen keine neuen Tokens anlegen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                label:
                  type: string
                  maxLength: 120
                scope:
                  type: string
                  enum: [full, read_only]
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Nur jetzt zurückgegeben
                  apiToken:
                    $ref: "#/components/schemas/ApiTokenPublic"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/auth/api-tokens/{id}:
    delete:
      tags: [auth]
      summary: API-Token widerrufen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Widerrufen
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/events:
    get:
      tags: [events]
      summary: Alle Events (nicht soft-deleted)
      parameters:
        - name: mainEventId
          in: query
          required: false
          description: Nur Runden dieses Events; `none` = nur Runden ohne Event.
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/GameEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [events]
      summary: Event anlegen
      description: Benötigt Manager-, Organisator- oder Admin-Rolle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCreate"
      responses:
        "201":
          description: Angelegt
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/events/{id}:
    patch:
      tags: [events]
      summary: Event aktualisieren
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Event abgeschlossen

  /api/events/{id}/participation:
    post:
      tags: [events]
      summary: Teilnahme setzen (dabei / nicht dabei)
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: u.a. Event voll

  /api/events/{id}/cancel:
    post:
      tags: [events]
      summary: Event stornieren
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "204":
          description: OK

  /api/events/{id}/archive:
    post:
      tags: [events]
      summary: Event archivieren
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "204":
          description: OK

  /api/main-events:
    get:
      tags: [main-events]
      summary: Alle Events (laufend, geplant, beendet)
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  mainEvents:
                    type: array
                    items:
                      $ref: "#/components/schemas/MainEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [main-events]
      summary: Event anlegen (Status planned)
      description: Benötigt Manager- oder Admin-Rolle und CSRF-Token (außer API-Token mit Schreibrecht).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MainEventInput"
      responses:
        "201":
          description: Angelegt
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/main-events/{id}:
    patch:
      tags: [main-events]
      summary: Name, Beschreibung oder geplante Zeiten ändern (nicht bei beendeten Events)
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MainEventInput"
      responses:
        "200":
          description: OK
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Event beendet (hauptevent_beendet)
    delete:
      tags: [main-events]
      summary: Geplantes Event löschen; zugeordnete Runden verlieren nur die Zuordnung
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "204":
          description: Gelöscht
        "409":
          description: Nur geplante Events sind löschbar (hauptevent_nicht_loeschbar)

  /api/main-events/{id}/start:
    post:
      tags: [main-events]
      summary: Event starten; neue Runden gehören danach automatisch dazu
      description: Es läuft höchstens ein Event gleichzeitig. Sendet eine Push-Benachrichtigung.
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: OK
        "409":
          description: Nicht geplant (hauptevent_nicht_geplant) oder anderes Event läuft (anderes_hauptevent_laeuft)

  /api/main-events/{id}/participation:
    post:
      tags: [main-events]
      summary: Am Event teilnehmen oder absagen (jede angemeldete Person)
      description: Teilnehmer („joined“) bekommen die Push-Benachrichtigungen zu den Runden des Events; Runden ohne Event gehen weiter an alle.
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [joined, declined]
      responses:
        "200":
          description: OK
        "409":
          description: Event beendet (hauptevent_beendet)

  /api/main-events/invite-candidates:
    get:
      tags: [main-events]
      summary: Aktive Personen zum Einladen (Manager/Admin)
      responses:
        "200":
          description: "`users`: Liste aus id und username"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/main-events/{id}/invites:
    post:
      tags: [main-events]
      summary: Personen zu einem Event einladen (Manager/Admin); bei privaten Events bekommen sie einen Push
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: OK
        "400":
          description: Unbekannte Person (ungueltige_einladung)
        "409":
          description: Event beendet

  /api/main-events/{id}/invites/{userId}:
    delete:
      tags: [main-events]
      summary: Einladung zurücknehmen; bei privaten Events entfällt auch die Teilnahme
      parameters:
        - $ref: "#/components/parameters/EventId"
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "404":
          description: Einladung nicht gefunden

  /api/main-events/{id}/end:
    post:
      tags: [main-events]
      summary: Event beenden; offene Runden des Events werden archiviert
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: OK, `archivedRounds` nennt die Zahl archivierter Runden
        "409":
          description: Event läuft nicht (hauptevent_laeuft_nicht)

  /api/admin/users:
    get:
      tags: [admin]
      summary: Benutzerliste
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      summary: Benutzer anlegen
      responses:
        "201":
          description: OK
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/users/{id}:
    patch:
      tags: [admin]
      summary: Benutzer aktualisieren
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: OK
    delete:
      tags: [admin]
      summary: Benutzer löschen (soft)
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: OK

  /api/admin/invite-codes:
    get:
      tags: [admin]
      summary: Invite-Codes
      responses:
        "200":
          description: OK
    post:
      tags: [admin]
      summary: Invite-Code anlegen
      responses:
        "201":
          description: OK

  /api/admin/invite-codes/{id}/deactivate:
    post:
      tags: [admin]
      summary: Invite deaktivieren
      parameters:
        - $ref: "#/components/parameters/InviteId"

  /api/admin/invite-codes/{id}/reactivate:
    post:
      tags: [admin]
      summary: Invite reaktivieren
      parameters:
        - $ref: "#/components/parameters/InviteId"

  /api/admin/settings:
    get:
      tags: [admin]
      summary: Vollständige App-Einstellungen
      responses:
        "200":
          description: OK
    put:
      tags: [admin]
      summary: Einstellungen speichern (Teil-Update)
      responses:
        "200":
          description: OK

  /api/admin/events/{id}:
    delete:
      tags: [admin]
      summary: Event soft-deleten (Admin)
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "204":
          description: OK

  /api/push/public-key:
    get:
      tags: [push]
      summary: VAPID Public Key
      security: []
      responses:
        "200":
          description: OK

  /api/push/subscriptions:
    post:
      tags: [push]
      summary: Push-Subscription registrieren
      description: Benötigt Session oder Bearer; bei API-Token ist `sessionId` der Subscription optional null.
      responses:
        "201":
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/push/preferences:
    patch:
      tags: [push]
      summary: Benachrichtigungen ein/aus
      responses:
        "200":
          description: OK

  /api/realtime/events:
    get:
      tags: [realtime]
      summary: SSE Event-Stream
      description: text/event-stream
      responses:
        "200":
          description: Stream

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: hermes_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API-Token

  parameters:
    EventId:
      name: id
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
    InviteId:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    Unauthorized:
      description: Nicht angemeldet
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: nicht_angemeldet
    Forbidden:
      description: Fehlende Rechte oder read-only-Token auf Schreiboperation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            admin:
              value:
                error: admin_erforderlich
            readOnly:
              value:
                error: api_token_nur_lesen
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Maschinenlesbarer Code

    ApiTokenPublic:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
          nullable: true
        scope:
          type: string
          enum: [full, read_only]
        createdAt:
          type: string
        lastUsedAt:
          type: string
          nullable: true
        revokedAt:
          type: string
          nullable: true

    MainEvent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [planned, running, ended]
        visibility:
          type: string
          enum: [public, private]
          description: Private Events (und ihre Runden) sehen nur Eingeladene sowie Manager und Admins.
        invites:
          type: array
          description: Nur für Manager/Admins und nur bei privaten Events
          items:
            type: object
            properties:
              userId:
                type: string
              username:
                type: string
        plannedStartAt:
          type: string
          nullable: true
        plannedEndAt:
          type: string
          nullable: true
        startedAt:
          type: string
          nullable: true
        endedAt:
          type: string
          nullable: true
        roundCount:
          type: integer
        participantCount:
          type: integer
        myParticipation:
          type: string
          nullable: true
          enum: [joined, declined]

    MainEventInput:
      type: object
      properties:
        name:
          type: string
          description: Pflicht beim Anlegen, 1–120 Zeichen
        description:
          type: string
          nullable: true
        visibility:
          type: string
          enum: [public, private]
          description: Standard public. Beim Wechsel auf private werden bisherige Teilnehmer eingeladen.
        plannedStartAt:
          type: string
          nullable: true
          description: ISO-8601
        plannedEndAt:
          type: string
          nullable: true
          description: ISO-8601, nicht vor plannedStartAt

    GameEvent:
      type: object
      properties:
        id:
          type: string
        mainEventId:
          type: string
          nullable: true
        mainEventName:
          type: string
          nullable: true
        gameTitle:
          type: string
        startMode:
          type: string
          enum: [now, scheduled]
        startsAt:
          type: string
        minPlayers:
          type: integer
        maxPlayers:
          type: integer
        details:
          type: string
          nullable: true
        status:
          type: string
        joinedCount:
          type: integer
        myParticipation:
          type: string
          nullable: true
          enum: [joined, declined]

    EventCreate:
      type: object
      required: [gameTitle, startMode, minPlayers, maxPlayers]
      properties:
        gameTitle:
          type: string
        startMode:
          type: string
          enum: [now, scheduled]
        startsAt:
          type: string
          description: ISO-8601, Pflicht wenn startMode scheduled
        mainEventId:
          type: string
          nullable: true
          description: Event der Runde; fehlt das Feld, gilt das laufende Event, null = keinem Event
        minPlayers:
          type: integer
        maxPlayers:
          type: integer
        details:
          type: string
          maxLength: 4000
